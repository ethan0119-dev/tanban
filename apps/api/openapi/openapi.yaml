openapi: 3.0.3
info:
  title: Tanban Restaurant SaaS API
  version: 0.1.0
  description: 所有业务时间均按北京时间（Asia/Shanghai，UTC+8）输入、计算和展示；响应中的本地日期时间统一为 `YYYY-MM-DD HH:mm:ss`。需表达绝对时刻的请求可使用带 `+08:00` 的 RFC3339。
servers:
  - url: https://tbapi.666qwe.cn/api/v1
paths:
  /auth/login:
    post:
      summary: 平台或商户账号登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, portal]
              properties:
                username: {type: string}
                password: {type: string, format: password}
                portal: {type: string, enum: [platform, merchant]}
      responses:
        '200': {description: JWT and current user}
  /auth/me:
    get:
      summary: 当前账号
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user}
  /platform/dashboard:
    get:
      summary: 平台经营概览
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Platform metrics}
  /platform/tenants:
    get:
      summary: 商户列表
      security: [{bearerAuth: []}]
      responses: {'200': {description: Tenant page}}
    post:
      summary: 创建商户，可原子创建首店和老板账号
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: {type: string}
                name: {type: string}
                owner_username: {type: string}
                owner_password: {type: string, format: password, minLength: 8}
                owner_display_name: {type: string}
                initial_store_code: {type: string}
                initial_store_name: {type: string}
      responses: {'200': {description: 'Created tenant, first store and owner account'}}
  /platform/tenants/{tenantID}/owner:
    parameters:
      - in: path
        name: tenantID
        required: true
        schema: {type: integer, format: int64}
    post:
      summary: 为尚无老板账号的商户补建首个老板账号
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, display_name]
              properties:
                username: {type: string, maxLength: 64}
                password: {type: string, format: password, minLength: 8, maxLength: 72}
                display_name: {type: string}
      responses:
        '201': {description: Created merchant owner account; plaintext password is never returned}
  /platform/tenants/{tenantID}/service-expiration:
    put:
      summary: 设置商户服务到期日，空值表示长期有效
      parameters:
      - in: path
        name: tenantID
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at: {type: string, format: date, nullable: true}
      responses:
        '200': {description: Updated tenant}
  /platform/tenants/{tenantID}/renew-one-year:
    post:
      summary: 商户快捷续期一年
      description: 从当前到期日或今天（取较晚者）起顺延一年。
      parameters:
      - in: path
        name: tenantID
        required: true
        schema: {type: integer, format: int64}
      responses:
        '200': {description: Renewed tenant}
        '409': {description: Merchant already has an owner account}
  /platform/tenants/{tenantID}/miniapp-settings:
    parameters:
      - in: path
        name: tenantID
        required: true
        schema: {type: integer, format: int64}
    get:
      summary: 查询租户的公版与独立小程序渠道
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Mini-program channel settings; AppSecret is never returned}
    put:
      summary: 配置租户主要小程序渠道及独立 AppID
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [primaryMode, publicEnabled, dedicatedEnabled]
              properties:
                primaryMode: {type: string, enum: [PUBLIC, DEDICATED]}
                publicEnabled: {type: boolean}
                dedicatedEnabled: {type: boolean}
                dedicatedDisplayName: {type: string, maxLength: 120}
                dedicatedAppId: {type: string}
                dedicatedAppSecret: {type: string, format: password, writeOnly: true}
      responses:
        '200': {description: Updated mini-program settings}
        '409': {description: AppID is already bound to another tenant}
  /merchant/dashboard:
    get:
      summary: 商户经营概览
      security: [{bearerAuth: []}]
      responses: {'200': {description: Merchant metrics}}
  /merchant/cashier/session:
    post:
      summary: 签发或轮换收银终端会话
      description: 由当前商户账号签发一年期、仅可访问收银业务接口的终端令牌；收银台每次打开时自动轮换。
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Cashier terminal access token and expiration}
  /merchant/cashier/context:
    get:
      summary: 收银终端门店与操作员上下文
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current store and cashier operator}
  /merchant/cashier/handover:
    post:
      summary: 完成当前收银班次交接并记录审计信息
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remark: {type: string, maxLength: 255}
      responses:
        '200': {description: Handover timestamp and operator}
  /merchant/table-board:
    get:
      summary: 收银台桌台状态看板
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Areas, tables and their active orders}
  /merchant/orders/{orderID}/cashier-settle:
    parameters:
      - in: path
        name: orderID
        required: true
        schema: {type: integer, format: int64}
    post:
      summary: 收银台确认先付订单的现金或系统外收款
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: {type: string, enum: [CASH, EXTERNAL]}
                remark: {type: string, maxLength: 255}
      responses:
        '200': {description: Settled order}
        '409': {description: Order is not settleable or another payment is in progress}
  /merchant/orders/{orderID}/settle:
    parameters:
      - in: path
        name: orderID
        required: true
        schema: {type: integer, format: int64}
    post:
      summary: 收银台确认后付订单的现金或系统外收款
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: {type: string, enum: [CASH, EXTERNAL]}
                remark: {type: string, maxLength: 255}
      responses:
        '200': {description: Settled order}
        '409': {description: Order is not settleable}
  /merchant/orders/{orderID}/diner-count:
    parameters:
      - in: path
        name: orderID
        required: true
        schema: {type: integer, format: int64}
    post:
      summary: 修改堂食订单就餐人数
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diner_count]
              properties:
                diner_count: {type: integer, minimum: 1, maximum: 99}
      responses:
        '200': {description: Updated order}
        '409': {description: Order can no longer be edited}
  /merchant/account/password:
    put:
      summary: 当前商户账号修改自己的登录密码
      description: 只能修改当前 JWT 对应账号；接口不接受目标用户 ID。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, minLength: 8, maxLength: 72}
      responses:
        '200': {description: Password changed}
        '400': {description: Current password is incorrect or new password is invalid}
  /merchant/notifications:
    get:
      summary: 当前商户账号的通知收件箱
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - in: query
          name: unread_only
          schema: {type: boolean}
      responses: {'200': {description: Paginated platform notifications}}
  /merchant/notifications/unread-count:
    get:
      summary: 当前商户账号的未读通知数
      security: [{bearerAuth: []}]
      responses: {'200': {description: Unread count}}
  /merchant/notifications/read-all:
    post:
      summary: 将当前商户账号的全部通知标记为已读
      security: [{bearerAuth: []}]
      responses: {'200': {description: Number of notifications marked as read}}
  /merchant/notifications/{notificationID}:
    parameters:
      - in: path
        name: notificationID
        required: true
        schema: {type: integer, format: int64}
    get:
      summary: 查看当前商户可见的通知详情
      security: [{bearerAuth: []}]
      responses: {'200': {description: Notification detail}}
  /merchant/notifications/{notificationID}/read:
    parameters:
      - in: path
        name: notificationID
        required: true
        schema: {type: integer, format: int64}
    post:
      summary: 幂等标记一条通知为已读
      security: [{bearerAuth: []}]
      responses: {'200': {description: Updated notification}}
  /merchant/products:
    get:
      summary: 商品和 SKU 列表
      security: [{bearerAuth: []}]
      responses: {'200': {description: Products}}
    post:
      summary: 创建商品及 SKU
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses: {'200': {description: Created product}}
  /merchant/products/import-template:
    get:
      summary: 下载菜单批量导入 Excel 模板
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: XLSX template with product, SKU, attribute and modifier worksheets
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
  /merchant/products/import/preview:
    post:
      summary: 预检菜单批量导入文件
      description: 分类按名称复用或计划新建；属性组和加料组按名称复用，缺少时要求模板中提供完整定义。不会写入数据。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {description: Import preview, row issues and create/reuse summary}
        '400': {description: Invalid, encrypted or oversized workbook}
  /merchant/products/import:
    post:
      summary: 事务性批量导入菜单
      description: 重新校验文件后一次性创建分类、配置库、商品、图片、SKU 和库存；任一错误会回滚整批导入。只新增商品，不覆盖已有商品。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Created product and configuration counts}
        '400': {description: Invalid, encrypted or oversized workbook}
        '422': {description: Workbook no longer passes validation}
  /merchant/products/{productID}:
    parameters:
      - in: path
        name: productID
        required: true
        schema: {type: integer, format: int64}
    get:
      summary: 商品详情（含 SKU 与最多四张商品图）
      security: [{bearerAuth: []}]
      responses: {'200': {description: Product detail}}
    put:
      summary: 更新商品、SKU 与商品图片
      description: images 缺省时兼容旧版 image_url；显式传 images 时必须最多四张且恰好一张主图。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses: {'200': {description: Updated product}}
    delete:
      summary: 软删除商品、SKU 与商品图片关系
      security: [{bearerAuth: []}]
      responses: {'200': {description: Deleted}}
  /merchant/products/{productID}/actions:
    parameters:
      - in: path
        name: productID
        required: true
        schema: {type: integer, format: int64}
    post:
      summary: 商品上下架、推荐、复制与库存快捷操作
      description: COPY 会复制 SKU、库存、商品图、规格选项、加料组和商品资源绑定；副本默认下架且不推荐。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductActionInput'}
      responses:
        '200': {description: 'Product after action, or copied product'}
        '400': {description: Invalid action or stock}
  /merchant/products/{productID}/statistics:
    parameters:
      - in: path
        name: productID
        required: true
        schema: {type: integer, format: int64}
      - in: query
        name: from
        schema: {type: string, format: date-time}
      - in: query
        name: to
        schema: {type: string, format: date-time}
    get:
      summary: 商品销售统计
      description: 只统计发生过成功支付的订单；毛销售额按订单商品小计计算，不扣退款，metric_scope 固定为 PAID_ORDER_GROSS_BEFORE_REFUNDS。
      security: [{bearerAuth: []}]
      responses: {'200': {description: Product gross sales statistics}}
  /merchant/media-groups:
    get:
      summary: 当前商户门店图片分组
      security: [{bearerAuth: []}]
      responses: {'200': {description: Media group list}}
    post:
      summary: 创建图片分组
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaGroupInput'}
      responses: {'201': {description: Created media group}}
  /merchant/media-groups/{groupID}:
    parameters:
      - in: path
        name: groupID
        required: true
        schema: {type: integer, format: int64}
    put:
      summary: 修改图片分组名称和排序
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaGroupInput'}
      responses: {'200': {description: Updated media group}}
    delete:
      summary: 删除图片分组并将组内图片移至未分组
      security: [{bearerAuth: []}]
      responses: {'200': {description: Deleted media group}}
  /merchant/media-assets:
    get:
      summary: 分页查询当前商户门店图片库
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - in: query
          name: group_id
          schema: {type: integer, format: int64, minimum: 0}
          description: 0 表示未分组；不传表示全部。
        - in: query
          name: q
          schema: {type: string, maxLength: 120}
      responses: {'200': {description: Paginated media assets}}
    post:
      summary: 登记一个外部 HTTPS 图片素材
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaAssetInput'}
      responses: {'201': {description: Created media asset}}
  /merchant/media-assets/upload:
    post:
      summary: 上传商户装修图片
      description: 图片按当前商户和门店隔离存储，支持 JPEG、PNG 和 GIF，单文件最大 8 MiB。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                name: {type: string, maxLength: 120}
                group_id: {type: integer, format: int64, minimum: 0}
      responses:
        '201':
          description: Created media asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MediaAsset'}
        '400': {description: Invalid multipart form or name}
        '413': {description: File exceeds 8 MiB}
        '415': {description: Unsupported or invalid image}
  /merchant/media-assets/{assetID}:
    parameters:
      - in: path
        name: assetID
        required: true
        schema: {type: integer, format: int64}
    put:
      summary: 修改图片名称或分组
      description: group_id=0 移至未分组；已上传图片的 URL 和文件元数据由服务端管理，不可替换。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaAssetInput'}
      responses: {'200': {description: Updated media asset}}
    delete:
      summary: 删除未被引用的图片
      description: 当前或历史装修、商品、营销弹窗、门店品牌、会员卡、加料或分类仍引用图片时返回 MEDIA_ASSET_IN_USE。
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Deleted media asset}
        '409': {description: MEDIA_ASSET_IN_USE}
  /merchant/orders:
    get:
      summary: 商户订单列表
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: order_type
          schema: {type: string, enum: [DINE_IN, TAKEOUT, DELIVERY]}
          description: 可使用兼容别名 orderType 或 order_scene
        - in: query
          name: keyword
          schema: {type: string, maxLength: 100}
          description: 订单号、顾客、桌台或取餐号模糊搜索
        - in: query
          name: startAt
          schema: {type: string, format: date-time}
        - in: query
          name: endAt
          schema: {type: string, format: date-time}
        - in: query
          name: cashier_active
          schema: {type: boolean}
          description: 收银台带走订单视图；仅返回未结束订单，以及进入“请取餐”不足 24 小时的订单
      responses: {'200': {description: Order page}}
  /merchant/pickup-display:
    get:
      summary: 当前营业日快餐取餐大屏
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Store identity and active TAKEOUT pickup codes grouped by preparing and ready
  /merchant/table-areas:
    get:
      summary: 桌台区域列表
      security: [{bearerAuth: []}]
      responses: {'200': {description: Table areas}}
    post:
      summary: 创建桌台区域
      security: [{bearerAuth: []}]
      responses: {'200': {description: Created table area}}
  /merchant/table-codes:
    get:
      summary: 桌码列表
      security: [{bearerAuth: []}]
      responses: {'200': {description: Table codes with stable public scene}}
    post:
      summary: 创建桌码
      security: [{bearerAuth: []}]
      responses: {'200': {description: Created table code}}
  /merchant/table-areas/{areaID}:
    put:
      summary: 修改桌台区域或启停状态
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: areaID
          required: true
          schema: {type: integer, format: int64}
      responses: {'200': {description: Updated table area}}
    delete:
      summary: 删除没有桌位引用的区域
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: areaID
          required: true
          schema: {type: integer, format: int64}
      responses: {'200': {description: Deleted table area}}
  /merchant/table-codes/{tableID}:
    put:
      summary: 修改桌台资料或启停状态，publicId 保持不变
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: tableID
          required: true
          schema: {type: integer, format: int64}
      responses: {'200': {description: Updated table code}}
  /merchant/print-templates:
    get:
      summary: 按经营场景读取小票和标签模板
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: businessType
          schema: {type: string, enum: [DINE_IN, TAKEOUT, DELIVERY]}
      responses: {'200': {description: Print templates}}
    post:
      summary: 保存经营场景打印模板
      security: [{bearerAuth: []}]
      responses: {'200': {description: Created or replaced template}}
  /merchant/refunds:
    post:
      summary: 部分或全额退款
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount_cents]
              properties:
                order_id: {type: integer, format: int64}
                amount_cents: {type: integer, format: int64, minimum: 1}
                reason: {type: string}
      responses: {'201': {description: Refund created}}
  /merchant/business-hours:
    get:
      summary: 读取门店每周营业计划与当前营业状态
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Weekly schedule, timezone, override and current business state'}
    put:
      summary: 更新按北京时间执行的七天多时段营业计划
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone, weeklySchedule]
              properties:
                timezone: {type: string, enum: [Asia/Shanghai], example: Asia/Shanghai, description: 固定为北京时间。}
                weeklySchedule:
                  type: array
                  items:
                    type: object
                    required: [weekday, periods]
                    properties:
                      weekday: {type: integer, minimum: 1, maximum: 7}
                      periods:
                        type: array
                        maxItems: 6
                        items:
                          type: object
                          required: [start, end]
                          properties:
                            start: {type: string, example: '08:00'}
                            end: {type: string, example: '24:00'}
      responses: {'200': {description: Updated schedule and current state}}
  /merchant/business-status:
    put:
      summary: 设置或取消临时营业/闭店覆盖
      security: [{bearerAuth: []}]
      requestBody:
        required: true
