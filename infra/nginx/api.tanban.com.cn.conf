server {
    listen 80;
    listen [::]:80;
    server_name api.tanban.com.cn;
    location ^~ /.well-known/acme-challenge/ { root /srv/tanban/shared/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tanban.com.cn;

    access_log /var/log/nginx/api.tanban.com.cn.access.log;
    error_log /var/log/nginx/api.tanban.com.cn.error.log;
    ssl_certificate /etc/letsencrypt/live/tanban.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanban.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TanbanTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /YYMFacfbfJ.txt {
        root /srv/tanban/shared/api-public;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
