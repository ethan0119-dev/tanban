server {
    listen 80;
    listen [::]:80;
    server_name b.tanban.com.cn;
    location ^~ /.well-known/acme-challenge/ { root /srv/tanban/shared/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b.tanban.com.cn;

    access_log /var/log/nginx/b.tanban.com.cn.access.log;
    error_log /var/log/nginx/b.tanban.com.cn.error.log;
    ssl_certificate /etc/letsencrypt/live/tanban.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanban.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/tanban/shared/static/merchant/current;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://api.tanban.com.cn wss://api.tanban.com.cn; form-action 'self'" always;

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
