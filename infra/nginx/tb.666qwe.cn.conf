server {
    listen 80;
    server_name tb.666qwe.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/tanban-website-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tb.666qwe.cn;

    access_log /www/wwwlogs/tb.666qwe.cn.access.log;
    error_log  /www/wwwlogs/tb.666qwe.cn.error.log;

    ssl_certificate     /etc/letsencrypt/live/tb.666qwe.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tb.666qwe.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tbapi.666qwe.cn; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
