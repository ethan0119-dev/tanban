# First-deploy HTTP configuration. Install this file before requesting the
# certificate, then replace it with the four production vhosts.
server {
    listen 80;
    listen [::]:80;
    server_name tanban.com.cn www.tanban.com.cn api.tanban.com.cn admin.tanban.com.cn b.tanban.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/tanban/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 200 "tanban certificate bootstrap\n";
        add_header Content-Type text/plain;
    }
}
